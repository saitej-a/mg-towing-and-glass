<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="Illustration of an emergency beacon light">
  <defs>
    <linearGradient id="darkB" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2a2f38"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="redB" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ff6a4d"/>
      <stop offset="0.5" stop-color="#ff2d20"/>
      <stop offset="1" stop-color="#a11409"/>
    </linearGradient>
    <radialGradient id="haloR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff3b1f" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2d20" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softB" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <ellipse cx="210" cy="404" rx="170" ry="42" fill="url(#floorB)" filter="url(#softB)"/>
  <ellipse cx="210" cy="200" rx="150" ry="120" fill="url(#haloR)" opacity="0.55"/>

  <!-- magnetic base -->
  <ellipse cx="210" cy="368" rx="96" ry="26" fill="url(#darkB)"/>
  <rect x="114" y="330" width="192" height="38" rx="10" fill="url(#darkB)"/>

  <!-- body -->
  <path d="M140 330 L146 250 L274 250 L280 330 Z" fill="url(#darkB)"/>
  <rect x="146" y="240" width="128" height="24" rx="8" fill="#14171d"/>

  <!-- lens block left -->
  <rect x="132" y="150" width="70" height="96" rx="16" fill="url(#redB)"/>
  <!-- lens block right -->
  <rect x="218" y="150" width="70" height="96" rx="16" fill="url(#redB)"/>

  <!-- lens highlights -->
  <rect x="140" y="158" width="18" height="80" rx="8" fill="#fff" opacity="0.22"/>
  <rect x="226" y="158" width="18" height="80" rx="8" fill="#fff" opacity="0.18"/>

  <!-- amber corner pods -->
  <rect x="104" y="196" width="26" height="40" rx="9" fill="#ffb020"/>
  <rect x="290" y="196" width="26" height="40" rx="9" fill="#ffb020"/>

  <!-- cap + handle -->
  <rect x="160" y="122" width="100" height="34" rx="12" fill="url(#darkB)"/>
  <path d="M188 122 q22 -30 44 0" fill="none" stroke="#c4cad4" stroke-width="10" stroke-linecap="round"/>

  <!-- glow blooms -->
  <ellipse cx="167" cy="198" rx="74" ry="62" fill="#ff2d20" opacity="0.34" filter="url(#softB)"/>
  <ellipse cx="253" cy="198" rx="74" ry="62" fill="#ff2d20" opacity="0.26" filter="url(#softB)"/>
</svg>